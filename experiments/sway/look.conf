# sway made to look and behave like tidewm and tide, as far as its config
# allows (REPORT.md, "Appearance"). No bar block: tide's bar is its own
# Quickshell one, a layer surface whose exclusive zone sway honors.

# tide: no borders, no title bars, no gaps (its SPEC §6.2)
default_border none
default_floating_border none
titlebar_border_thickness 0
titlebar_padding 1
gaps inner 0
gaps outer 0
smart_borders off
# tidewm's background (rootcolor 0x222222) is drawn by swaybg on sway
output * bg #222222 solid_color

# tide's colors, for the borders a for_window rule might turn on:
# class        border  bg      text    indicator child_border
client.focused   #005577 #005577 #eeeeee #005577 #005577
client.unfocused #444444 #222222 #bbbbbb #444444 #444444
client.urgent    #ff0000 #ff0000 #ffffff #ff0000 #ff0000

# tidewm's behavior where sway has a setting for it
focus_follows_mouse yes
focus_on_window_activation urgent
mouse_warping none
floating_minimum_size 1 x 1
floating_maximum_size -1 x -1
xwayland enable
