# xdg-desktop-portal's backends for a session whose XDG_CURRENT_DESKTOP
# starts with tidewm, as tide's tidewm session does. xdg-desktop-portal
# reads the file named after the first name it has one for.
# xdg-desktop-portal-wlr shares the screen and takes screenshots, through
# the capture protocols tidewm offers. xdg-desktop-portal-gtk does the
# rest, such as the file chooser. Hyprland's portal is never picked, even
# where it's installed: it needs Hyprland's own protocols.
[preferred]
default=wlr;gtk
