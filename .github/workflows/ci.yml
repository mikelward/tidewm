name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

# simmo's shape (mikelward/simmo ci.yml, which says why each half is so). A
# pull request shares one group and cancels the run in progress when a newer
# event on it starts one: a push makes it stale, and the body or title edit
# `edited` reports beside each push duplicates it. Without it every push ran
# twice, and the older run's checks failed on the head moving. A push to
# main, or a dispatch aimed at it, gets a group of its own keyed by commit, so
# no main run is canceled or evicted from the one pending slot a group holds.
# Keyed on the event, not the ref, so a move to `pull_request_target` can't
# collapse every pull request into one group.
#
# An `edited` run never cancels: it carries the head as of the edit, and the
# body edit lands just before its push, so GitHub starting it after the push's
# run (it doesn't promise the order) would cancel the only run on the new head.
# It queues behind the run in progress instead, and a later push's run
# replaces it while it waits.
concurrency:
  group: ci-${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && format('main-{0}', github.sha) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && github.event.action != 'edited' }}

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
      base_sha: ${{ steps.lane.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        id: lane
        with:
          mode: classify
          pr: ${{ github.event.pull_request.number }}

  # dwl's main branch builds against the latest wlroots release
  # (`wlroots-0.20` in config.mk), which Ubuntu runners don't ship, so the
  # build runs in an Arch Linux container. Both variants compile: the
  # XWayland one turns on the `#ifdef XWAYLAND` code paths.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    container:
      image: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        xwayland: [false, true]
    steps:
      - run: >-
          pacman -Syu --noconfirm --needed
          wlroots0.20 wayland wayland-protocols libinput libxkbcommon
          libxcb xcb-util-wm json-c pcre2 pkgconf
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - if: ${{ !matrix.xwayland }}
        run: make
      - if: ${{ matrix.xwayland }}
        run: make XWAYLAND=-DXWAYLAND XLIBS="xcb xcb-icccm"

  # Debian testing is where tide runs this, from apt's wlroots 0.20 and GCC,
  # so it builds there too. A job of its own, beside `build`, so the checks
  # `build` already reports keep their names.
  build-debian:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    container:
      image: debian:testing
    strategy:
      fail-fast: false
      matrix:
        xwayland: [false, true]
    steps:
      - run: apt-get update
      - run: >-
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
          build-essential pkgconf libwlroots-0.20-dev libwayland-dev
          wayland-protocols libinput-dev libxkbcommon-dev libxcb1-dev
          libxcb-icccm4-dev libjson-c-dev libpcre2-dev
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - if: ${{ !matrix.xwayland }}
        run: make
      - if: ${{ matrix.xwayland }}
        run: make XWAYLAND=-DXWAYLAND XLIBS="xcb xcb-icccm"

  # tidewm on wlroots' headless backend, asserted over its IPC (tests/).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    container:
      image: debian:testing
    steps:
      - run: apt-get update
      - run: >-
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
          build-essential pkgconf libwlroots-0.20-dev libwayland-dev
          wayland-protocols libinput-dev libxkbcommon-dev libjson-c-dev libpcre2-dev python3
          libxcb1-dev libxcb-icccm4-dev xwayland wtype wlr-randr
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # With XWayland, so the X11 tests run too
      - run: make XWAYLAND=-DXWAYLAND XLIBS="xcb xcb-icccm" test
      # Built with XWayland but with no Xwayland to run, tidewm still exits
      # cleanly. wlroots checks for the binary only at its built-in path.
      - run: |
          mv /usr/bin/Xwayland /usr/bin/Xwayland.hidden
          cd tests && python3 -m unittest -v test_ipc.IpcTest.test_exit_says_so_then_stops

  lanes:
    name: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, build, build-debian, test]
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number }}
          classify-result: ${{ needs.classify.result }}
          base-sha: ${{ needs.classify.outputs.base_sha }}
          results: build=${{ needs.build.result }} build-debian=${{ needs.build-debian.result }} test=${{ needs.test.result }}
